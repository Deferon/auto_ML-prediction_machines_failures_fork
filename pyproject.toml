[project]
name = "machine-failure-prediction"
version = "0.2.0"
description = "Reproducible equipment failure prediction pipeline"
authors = [{name = "Яньшин А."}]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.3",
    "scikit-learn>=1.5,<2",
    "catboost>=1.2.7,<2",
    "mlflow>=2.22,<3",
    # MLflow 2.x imports a pool class removed in SQLAlchemy 2.1.
    "sqlalchemy>=2.0,<2.1",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "psutil>=6,<8",
]

[project.urls]
Repository = "https://github.com/Deferon/auto_ML-prediction_machines_failures_fork"

[project.scripts]
ml-train = "src.train:main"
ml-predict = "src.predict:main"

[tool.poetry]
packages = [{include = "src"}]
requires-poetry = ">=2.2,<3"

[tool.poetry.group.dev.dependencies]
pytest = "8.4.2"
pytest-cov = "7.0.0"
ruff = "0.14.0"
mypy = "1.18.2"
pre-commit = "4.3.0"
pre-commit-hooks = "6.0.0"

[build-system]
requires = ["poetry-core==2.2.1"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["reference-material", ".tooling", ".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: full training and inference integration test"]

[tool.coverage.run]
source = ["src"]
omit = ["src/plots.py"]
