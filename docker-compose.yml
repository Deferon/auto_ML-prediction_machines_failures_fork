services:
  train:
    build: .
    image: machine-failure-mlops:local
    volumes:
      - ml-artifacts:/app/artifacts
      - ./keis7-main:/app/keis7-main:ro
    command: ["src.train"]

  predict:
    build: .
    image: machine-failure-mlops:local
    volumes:
      - ml-artifacts:/app/artifacts
      - ./keis7-main:/app/keis7-main:ro
    command: ["src.predict"]
    depends_on:
      train:
        condition: service_completed_successfully

  mlflow:
    build: .
    image: machine-failure-mlops:local
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ml-artifacts:/app/artifacts
    entrypoint: ["mlflow"]
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////app/artifacts/mlflow.db
      - --default-artifact-root
      - /app/artifacts/mlartifacts

volumes:
  ml-artifacts:
