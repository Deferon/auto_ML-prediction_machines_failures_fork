# Tools run from the same Poetry lock as CI and local development.
minimum_pre_commit_version: "4.3.0"
default_install_hook_types: [pre-commit]
exclude: ^(reference-material/|keis7-main/|artifacts/|poetry.lock$)
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: poetry run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: poetry run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Mypy
        entry: poetry run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: poetry-check
        name: Poetry lock consistency
        entry: poetry check --lock --strict
        language: system
        pass_filenames: false
        files: ^(pyproject.toml|poetry.lock|poetry.toml)$
        always_run: true
      - id: check-yaml
        name: YAML syntax
        entry: poetry run check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: TOML syntax
        entry: poetry run check-toml
        language: system
        types: [toml]
      - id: check-merge-conflict
        name: Merge conflict markers
        entry: poetry run check-merge-conflict
        language: system
        types: [text]
      - id: trailing-whitespace
        name: Trailing whitespace
        entry: poetry run trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: Final newline
        entry: poetry run end-of-file-fixer
        language: system
        types: [text]
