name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.2.1"
  POETRY_NO_INTERACTION: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - name: Install locked development dependencies
        run: poetry sync --with dev
      - name: Run repository checks
        run: poetry run pre-commit run --all-files
      - name: Build package
        run: poetry build

  test:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - name: Install locked dependencies
        run: poetry sync --with dev
      - name: Unit and integration tests
        run: poetry run pytest -q --cov=src --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml

  docker:
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t machine-failure-mlops:ci .
      - name: Smoke train and predict
        run: |
          docker volume create ml-smoke
          docker run --rm -v ml-smoke:/app/artifacts machine-failure-mlops:ci src.train --smoke
          docker run --rm -v ml-smoke:/app/artifacts machine-failure-mlops:ci src.predict
      - name: Remove test volume
        if: always()
        run: docker volume rm ml-smoke || true
